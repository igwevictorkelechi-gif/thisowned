{% extends 'dashboard.html' %}

{% block content %}
    <div class="row">
        <div class="col-md-4 grid-margin stretch-card">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Collection form</h4>

                    <form class="forms-sample mt-5" method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Collection name</label>
                            <input type="text" class="form-control text-white" name="name">
                        </div>

                        <button type="submit" class="btn btn-light p-2 w-100 mt-3">Add collection</button>

                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-8 grid-magin">
            <div class="card">

                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th> # </th>
                                    <th> Collection list </th>
                                    <th class="text-center"> Action </th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for collection in  collections%}
                                    <tr>
                                        <td> {{forloop.counter}} </td>
                                        <td>
                                            <div>
                                                <span
                                                    style="font-weight: bold;font-size: 13px;">{{collection.name}}</span>
                                            </div>
                                        </td>
                                        <td class="text-center">
                                            <button class="btn btn-sm btn-light">Edit</button>
                                            <button class="btn btn-sm btn-danger ml-4">Delete</button>
                                        </td>

                                    </tr>
                                {% endfor %}

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
